name: Enterprise Auth CI/CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint, Build & Test Unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Validar Linter (ESLint)
        run: npm run lint

      - name: Probar compilacion (TypeScript Build)
        run: npm run build

      - name: Ejecutar Tests Unitarios
        run: npm run test

  e2e-test:
    name: Tests E2E (con Postgres real)
    needs: lint-and-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # DB del sistema (postgres), no la de la app.
          # test-utils.ts crea y destruye DBs de test dinamicamente.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Debe contener "test" para pasar la validacion de seguridad en global-setup.ts
      DB_NAME: enterprise_auth_test
      DB_SYNC: true
      JWT_ACCESS_SECRET: ci_test_jwt_access_secret_32_characters_min
      JWT_REFRESH_SECRET: ci_test_refresh_secret_32_characters
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Tests E2E
        run: npm run test:e2e

  docker-build:
    name: Build Docker Image
    needs: [lint-and-test, e2e-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: enterprise-auth:latest